[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-local"
version = "1.0.0"
license = "MIT"
readme = "README.md"
description = "Agente de IA local (Ollama + MCP) que faz o trabalho mecânico do Claude Code e economiza tokens"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "mcp>=2.3,<3",
    "playwright>=1.50",
    "pywinauto>=0.6.9; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "mss>=10",
    "pillow>=10",
    "pystray>=0.19",
    "psutil>=5.9",
    "numpy>=1.26",
    "fpdf2>=2.7",  # relatório em PDF do organizador de pastas
]

[project.optional-dependencies]
# Voz é opcional: o Piper é GPL-3.0, então fica fora da instalação padrão (que é só MIT/BSD/Apache/LGPL).
voz = [
    "sounddevice>=0.4",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    # DLLs CUDA para o Whisper na placa de vídeo (sem instalar o CUDA inteiro)
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
agente = "agente.cli:main"
agente-mcp = "agente.servidor_mcp:main"

[project.gui-scripts]
# .exe sem janela preta de console, usado pelo atalho "Acordar Agente"
agente-bandeja = "agente.bandeja:main"
# abre o painel no navegador padrão (sem janela de console no Windows)
agente-painel = "agente.painel_web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agente = ["icones/*.png", "icones/*.svg", "web_painel/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# pywinauto e pystray não têm tipos: os objetos de janela, controle e ícone são Any de verdade.
"src/agente/braco/janelas.py" = ["ANN401"]
"src/agente/bandeja.py" = ["ANN401"]
# tkinter, PIL, numpy e os modelos de voz: objetos sem tipo útil para anotar.
"src/agente/painel.py" = ["ANN401"]
"src/agente/config.py" = ["ANN401"]
"src/agente/voz/*" = ["ANN401"]
"src/agente/memoria.py" = ["ANN401"]
"src/agente/revisor.py" = ["ANN401"]
"src/agente/maestro.py" = ["ANN401"]
"src/agente/recursos.py" = ["ANN401"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "pywinauto.*", "mss.*", "win32clipboard", "win32com.*", "pystray.*",
    "psutil", "sounddevice", "faster_whisper", "piper",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
