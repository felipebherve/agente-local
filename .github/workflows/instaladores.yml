name: Instaladores

# Gera o instalador do Windows (.exe) e o do Linux (.run).
# - Em PR que mexe no app ou nos instaladores: gera e guarda como artefato do Actions.
# - Em tag v*: gera e publica na página de Releases.
on:
  pull_request:
    paths:
      - "instalador/**"
      - "install.ps1"
      - "install.sh"
      - "src/agente/icones/**"
      - ".github/workflows/instaladores.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versão
        id: versao
        shell: bash
        run: echo "v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DVersao=${{ steps.versao.outputs.v }}" instalador\windows\agente-local.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: AgenteLocal-Setup-Windows
          path: dist/AgenteLocal-Setup-Windows.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar o .run
        run: instalador/linux/criar-instalador.sh
      - name: Conferir o pacote
        run: |
          F=dist/AgenteLocal-Instalador-Linux.run
          bash -n "$F" 2>/dev/null || true
          L=$(awk '/^__PACOTE_AGENTE__$/ { print NR + 1; exit 0 }' "$F")
          mkdir -p "/tmp/teste com espaco"
          tail -n +"$L" "$F" | tar -xz -C "/tmp/teste com espaco"
          test -f "/tmp/teste com espaco/install.sh"
          test -f "/tmp/teste com espaco/src/agente/icones/app-512.png"
      - uses: actions/upload-artifact@v4
        with:
          name: AgenteLocal-Instalador-Linux
          path: dist/AgenteLocal-Instalador-Linux.run

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AgenteLocal-Setup-Windows.exe
            dist/AgenteLocal-Instalador-Linux.run
